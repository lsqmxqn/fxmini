# Build and check FxMini on every push.
#
# What this job is actually protecting:
#
#   * the Rust side compiles warning-free (the project treats a warning as a
#     build failure, so `cargo check` is gated the same way a `-D warnings` clippy
#     run would be);
#   * the unit tests pass — including the two that only fail if the vendored C++
#     DSP did not link, which is the most fragile part of the build;
#   * the release executable still carries its icon and version resource and does
#     not import the VC++ redistributable. Both of those failure modes are
#     *invisible* in a build log and only show up as "the exe has no icon" or
#     "the app does not start on someone else's machine", so `package.ps1` is run
#     here rather than only at release time — it is the thing that asserts them.
#
# The resulting zip is uploaded as an artifact, so a green build is directly
# downloadable without cutting a release.
#
# The `--ignored` test (`panel::tests`) is deliberately NOT run here: it opens a
# real window and needs an interactive desktop session. It is excluded by
# default for exactly that reason — see src/ui/panel.rs.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded push has nothing useful to say; only the newest run per ref kept.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: check, test, build, package
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Caches ~/.cargo and target/. The vendored C++ objects live under target/,
      # so this saves the expensive part of the build, not just the Rust crates.
      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # `toolchain.ps1` resolves the MSVC toolset through vswhere on this runner
      # (it falls back to a hardcoded path on the development machine, where
      # Visual Studio is not registered). Every cargo invocation runs after
      # dot-sourcing it, because INCLUDE/LIB/PATH do not survive between steps.
      - name: cargo check
        shell: pwsh
        run: |
          . ./toolchain.ps1
          cargo check --all-targets --locked

      - name: cargo test
        shell: pwsh
        run: |
          . ./toolchain.ps1
          cargo test --lib --locked

      - name: Build release executable
        shell: pwsh
        run: ./build.ps1 --locked --release --bin fxmini

      # Independent of package.ps1, which reads the version resource through
      # Windows' own API. This walks the PE resource directory itself and dumps
      # the largest icon, so a packaging bug cannot hide behind Windows'
      # perfectly reasonable answer.
      - name: Inspect the executable's PE resources
        shell: pwsh
        run: |
          python tools/inspect_resources.py target/release/fxmini.exe icon-check.png
          $info = (Get-Item target/release/fxmini.exe).VersionInfo
          if (-not $info.ProductName -or -not $info.FileVersion) {
            throw 'the executable has no version resource — and therefore no icon'
          }
          Write-Host "product: $($info.ProductName) $($info.FileVersion)"

      # Asserts the icon, the version resource and the absence of a VC++
      # redistributable import, then assembles and zips the distributable.
      #
      # toolchain.ps1 is dot-sourced here (again) even though -NoBuild skips the
      # build: the VC++ check needs `dumpbin.exe`, and INCLUDE/LIB/PATH do not
      # survive from the build step.
      - name: Package
        shell: pwsh
        run: |
          . ./toolchain.ps1
          ./package.ps1 -NoBuild

      - name: Show what was produced
        shell: pwsh
        run: Get-Content dist/SHA256SUMS.txt

      - name: Upload the zip
        uses: actions/upload-artifact@v4
        with:
          name: FxMini-win64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Keep the icon render for inspection
        uses: actions/upload-artifact@v4
        with:
          name: FxMini-icon
          path: icon-check.png
          if-no-files-found: error
          retention-days: 7
